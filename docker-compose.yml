version: '3.8'

services:
  rag-api:
    container_name: rag-api
    image: ghcr.io/hugo-p/rag-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # ── Embedding Provider 設定 ──
      # 可選值：local / openai / cloudflare / custom
      - EMBEDDING_PROVIDER=local

      # -- local 模式 --
      # - EMBEDDING_PROVIDER=local
      # - EMBEDDING_MODEL=moka-ai/m3e-base
      # - DEVICE=cpu

      # -- openai 模式（相容 Ollama / vLLM / Together AI 等）--
      # - EMBEDDING_API_KEY=sk-xxx
      # - EMBEDDING_API_URL=https://api.openai.com/v1
      # - EMBEDDING_MODEL=text-embedding-3-small


      # -- cloudflare 模式 --
      # - EMBEDDING_API_KEY=your-cf-api-token
      # - EMBEDDING_API_URL=https://api.cloudflare.com/client/v4/accounts/YOUR_ACCOUNT_ID
      # - EMBEDDING_MODEL=@cf/baai/bge-base-en-v1.5

      # -- custom 模式（任意 HTTP API）--
      # - EMBEDDING_API_KEY=optional-api-key
      # - EMBEDDING_API_URL=http://your-server:5000/embeddings
      # - EMBEDDING_MODEL=your-model-name

      # ── 通用設定 ──
      - CHROMA_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=100
      - TOP_K=5

      # ── LLM Provider 設定 ──
      # 可選值：none / openai
      - LLM_PROVIDER=none

      # -- openai 模式 --
      # - LLM_PROVIDER=openai
      # - LLM_API_KEY=sk-xxx
      # - LLM_API_URL=https://api.openai.com/v1
      # - LLM_MODEL=gpt-4o-mini
      # - LLM_MAX_TOKENS=1024
      # - LLM_TEMPERATURE=0.3

      # -- 自訂 System Prompt（可選）--
      # - DEFAULT_SYSTEM_PROMPT=你是一個專業助手，請用繁體中文回答問題。
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
