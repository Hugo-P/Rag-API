version: '3.8'

services:
  rag-api:
    container_name: rag-api
    image: ghcr.io/hugo-p/rag-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - EMBEDDING_MODEL=moka-ai/m3e-base
      - DEVICE=cpu
      - CHROMA_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=100
      - TOP_K=5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
