version: '3.8'

services:
  rag:
    image: ghcr.io/hugo-p/rag-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHROMA_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - TOP_K=5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
